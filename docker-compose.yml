services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: oryon_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - oryon_network
    depends_on:
      - db
      - redis

  web:
    image: nginx:alpine
    container_name: oryon_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - oryon_network
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: oryon_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-oryon_gestao}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - oryon_pgdata:/var/lib/postgresql/data
    networks:
      - oryon_network

  redis:
    image: redis:7-alpine
    container_name: oryon_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - oryon_redisdata:/data
    networks:
      - oryon_network

networks:
  oryon_network:
    driver: bridge

volumes:
  oryon_pgdata:
    driver: local
  oryon_redisdata:
    driver: local
